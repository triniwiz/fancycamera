apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    compileSdk = COMPILE_SDK_VERSION as int
    buildToolsVersion BUILD_TOOLS_VERSION as String
    ndkVersion '23.2.8568313'
    defaultConfig {
        minSdkVersion 21
        versionName = VERSION_NAME as String
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    namespace 'io.github.triniwiz.fancycamera'
}


dependencies {
//    implementation fileTree(dir: 'libs', include: ['*.jar'])
    api "androidx.appcompat:appcompat:$app_compat_version"
    implementation 'com.google.mlkit:vision-common:17.3.0'
    implementation 'androidx.databinding:databinding-runtime:8.3.2'
    //noinspection KtxExtensionAvailable
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    api "androidx.camera:camera-core:$camerax_version"
    api "androidx.camera:camera-camera2:$camerax_version"
    api "androidx.camera:camera-view:$camerax_view_version"
    //api "androidx.camera:camera-extensions:$camerax_ext_version"
    api "androidx.camera:camera-lifecycle:$camerax_lifecycle_version"
    api "androidx.camera:camera-video:$camerax_version"
    api "androidx.exifinterface:exifinterface:1.3.7"
    implementation "com.google.code.gson:gson:$gson_version"
}



repositories {
    mavenCentral()
}


apply from: "${rootProject.projectDir}/scripts/upload.gradle"